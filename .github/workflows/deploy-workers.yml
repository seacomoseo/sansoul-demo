name: Deploy to Cloudflare Workers
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-workers
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v5
        with:
          node-version: 22.22.3
          cache: pnpm
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 0.168.0
          extended: true
      - run: pnpm install --frozen-lockfile
      - name: Build (prebuild, Hugo, forms manifest, images)
        run: sh do build
      - name: Check generated Worker inputs
        run: |
          test -f worker/forms.generated.js
          test ! -e public/_forms
          test -f public/index.html
      - uses: actions/upload-artifact@v5
        with:
          name: site
          path: |
            public
            worker
          retention-days: 3

  deploy:
    name: Deploy workers.dev TEST
    needs: build
    # Always deploys from main; without the CLOUDFLARE_API_TOKEN secret the job
    # fails visibly. The account ID lives in wrangler.workers.toml.
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: workers-test
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_SEND_METRICS: 'false'
    steps:
      - name: Require the deploy token
        run: test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing secret CLOUDFLARE_API_TOKEN (CI token limited to this project's Cloudflare account)."; exit 1; }
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/download-artifact@v5
        with:
          name: site
      - uses: actions/setup-node@v5
        with:
          node-version: 22.22.3
      - name: Apply D1 migrations (this project's own database only)
        run: npx --yes wrangler@4.147.0 d1 migrations apply FORMS_DB --remote --config wrangler.workers.toml
      - name: Deploy Worker with Static Assets
        run: npx --yes wrangler@4.147.0 deploy --config wrangler.workers.toml

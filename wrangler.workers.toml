# Workers Free only: no Paid CPU limits, R2, remote migration sprees or custom
# domains. The Pages config in wrangler.toml stays as the rollback path.
# TEST resources of the SanSoul Cloudflare account.
name = "sansoul-demo"
main = "worker.js"
compatibility_date = "2025-12-10"
workers_dev = true
preview_urls = false

[assets]
directory = "public"
binding = "ASSETS"
run_worker_first = ["/api/forms/*"]
not_found_handling = "404-page"

[vars]
# `hold` stores submissions without sending: the demo never mails anyone.
FORMS_PROVIDER = "hold"
FORMS_SENDER_NAME = "SanSoul demo"

[[d1_databases]]
binding = "FORMS_DB"
database_name = "sansoul-demo-forms"
database_id = "0d957a3a-ea9b-43db-9a05-1565cfca985a"
migrations_dir = "core/forms/migrations"

[[kv_namespaces]]
binding = "FORMS_FILES"
id = "3e873478dbb94ec88e67875ee6c65416"

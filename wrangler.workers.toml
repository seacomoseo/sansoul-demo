# Workers Free only: no Paid CPU limits, R2, remote migration sprees or custom
# domains. The Pages config in wrangler.toml stays as the rollback path.
# Placeholder IDs: replace with the TEST resources of the Cloudflare account.
name = "sansoul-demo"
main = "worker.js"
compatibility_date = "2025-12-10"
workers_dev = true
preview_urls = false

[assets]
directory = "public"
binding = "ASSETS"
run_worker_first = ["/api/forms/*"]
not_found_handling = "404-page"

[vars]
# `hold` stores submissions without sending: the demo never mails anyone.
FORMS_PROVIDER = "hold"
FORMS_SENDER_NAME = "SanSoul demo"

[[d1_databases]]
binding = "FORMS_DB"
database_name = "sansoul-demo-forms"
database_id = "00000000-0000-0000-0000-0000000000f1"
migrations_dir = "core/forms/migrations"

[[kv_namespaces]]
binding = "FORMS_FILES"
id = "000000000000000000000000000000f2"

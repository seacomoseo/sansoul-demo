name: Preguntas frecuentes
size: md
boxes:
- title: Preguntas frecuentes
  sub: Sobre el contenido de muestra
  icon: help_outline
  faqs:
  - title: ¿Puedo copiar esta estructura a otro proyecto?
    md: Sí. El contenido raíz está pensado para servir como referencia inicial; sustituye los datos de ejemplo por información propia.
  - title: ¿Los precios y reseñas son reales?
    md: No. Son datos ficticios para visualizar componentes y probar las plantillas.
  - title: ¿El formulario envía mensajes?
    md: No se realizan envíos en esta demo. La dirección configurada usa el dominio reservado example.com.
